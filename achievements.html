<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Void of Reality - Achievement Leaderboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cinzel+Decorative:wght@700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --parchment: #b9b09a;
            --parchment-dark: #8e8572;
            --ink-dark: #0e0b0a;
            --ink-brown: #2b1c12;
            --gold: #b89b3c;
            --gold-dark: #6f5620;
            --blood-red: #6b0f14;
            --stone-dark: #141316;
            --stone-light: #2a2730;
            --arcane-blue: #2b3a55;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Crimson Text', Georgia, serif;
            background: var(--stone-dark);
            color: var(--parchment);
            min-height: 100vh;
            line-height: 1.7;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at 50% 35%, rgba(43, 58, 85, 0.10) 0%, transparent 45%),
                radial-gradient(circle at 50% 50%, transparent 0%, rgba(0,0,0,0.65) 85%);
            z-index: -1;
        }

        .stone-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(ellipse at 20% 30%, rgba(74, 64, 53, 0.4) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 70%, rgba(74, 64, 53, 0.3) 0%, transparent 50%),
                repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px),
                repeating-linear-gradient(90deg, transparent, transparent 2px, rgba(0,0,0,0.02) 2px, rgba(0,0,0,0.02) 4px),
                var(--stone-dark);
            z-index: -1;
        }

        .torch-glow-left,
        .torch-glow-right {
            position: fixed;
            top: 0;
            width: 150px;
            height: 100%;
            pointer-events: none;
        }

        .torch-glow-left {
            left: 0;
            background: radial-gradient(ellipse at left center, rgba(255,140,40,0.12), rgba(140,40,10,0.08), transparent 70%);
        }

        .torch-glow-right {
            right: 0;
            background: radial-gradient(ellipse at right center, rgba(255,140,40,0.12), rgba(140,40,10,0.08), transparent 70%);
        }

        .page-frame {
            position: relative;
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        header {
            text-align: center;
            padding: 40px 20px 30px;
            position: relative;
        }

        .banner-decoration {
            width: 100%;
            max-width: 650px;
            height: 3px;
            background: linear-gradient(90deg, transparent, rgba(184,155,60,0.9), rgba(43,58,85,0.55), transparent);
            margin: 0 auto 30px;
            position: relative;
        }

        .banner-decoration::before,
        .banner-decoration::after {
            content: '\25C6';
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gold);
            font-size: 12px;
        }

        .banner-decoration::before { left: 20%; }
        .banner-decoration::after { right: 20%; }

        h1 {
            font-family: 'Cinzel Decorative', 'Cinzel', serif;
            font-size: clamp(2rem, 6vw, 3.5rem);
            font-weight: 700;
            color: #8bb8ff;
            text-shadow:
                0 0 10px rgba(139, 184, 255, 0.35),
                0 0 22px rgba(107, 15, 20, 0.32),
                3px 3px 0 #000;
            letter-spacing: 0.08em;
            margin-bottom: 10px;
        }

        .subtitle {
            font-family: 'Cinzel', serif;
            font-size: 1.1rem;
            color: var(--parchment-dark);
            letter-spacing: 0.3em;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .last-update {
            font-size: 0.95rem;
            color: var(--parchment-dark);
            font-style: italic;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: var(--gold);
            text-decoration: none;
            font-family: 'Cinzel', serif;
            font-size: 1rem;
            letter-spacing: 0.1em;
            transition: color 0.3s;
        }

        .back-link:hover {
            color: var(--parchment);
        }

        .back-link::before {
            content: '\2190 ';
        }

        .leaderboard {
            background: linear-gradient(135deg, rgba(40, 36, 32, 0.95), rgba(25, 22, 20, 0.95));
            border-radius: 4px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.7), inset 0 0 40px rgba(201, 162, 39, 0.08);
            position: relative;
        }

        .leaderboard::before {
            content: '';
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            bottom: 10px;
            border: 1px solid rgba(139, 105, 20, 0.3);
            border-radius: 2px;
            pointer-events: none;
        }

        .player-row {
            display: flex;
            align-items: center;
            padding: 15px 25px;
            border-bottom: 1px solid rgba(58, 47, 42, 0.6);
            cursor: pointer;
            transition: background 0.2s;
            position: relative;
            z-index: 1;
        }

        .player-row:hover {
            background: rgba(107, 15, 20, 0.15);
        }

        .player-row.expanded {
            background: rgba(107, 15, 20, 0.25);
            border-bottom-color: var(--blood-red);
        }

        .rank {
            width: 60px;
            font-family: 'Cinzel', serif;
            font-weight: 700;
            font-size: 1.2em;
            color: var(--parchment-dark);
        }

        .rank-1 { 
            color: var(--gold); 
            text-shadow: 0 0 10px rgba(184, 155, 60, 0.5);
        }
        .rank-2 { color: #c0c0c0; }
        .rank-3 { color: #cd7f32; }

        .player-name {
            flex: 1;
            font-family: 'Cinzel', serif;
            font-size: 1.15em;
            color: #8bb8ff;
            letter-spacing: 0.05em;
        }

        .player-points {
            width: 100px;
            text-align: right;
            font-family: 'Cinzel', serif;
            color: var(--gold);
            font-weight: 600;
        }

        .arrow {
            width: 30px;
            text-align: center;
            color: var(--parchment-dark);
            transition: transform 0.2s;
            margin-left: 10px;
        }

        .player-row.expanded .arrow {
            transform: rotate(90deg);
        }

        .player-details {
            display: none;
            background: rgba(15, 14, 18, 0.95);
            padding: 25px;
            border-bottom: 2px solid var(--gold-dark);
            position: relative;
            z-index: 1;
        }

        .player-details.show {
            display: block;
        }

        .category-section {
            margin-bottom: 20px;
        }

        .category-section:last-child {
            margin-bottom: 0;
        }

        .category-name {
            font-family: 'Cinzel', serif;
            font-size: 1.1rem;
            color: #b02020;
            font-weight: 600;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(107, 15, 20, 0.4);
            letter-spacing: 0.08em;
        }

        .achievement-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .achievement-badge {
            background: linear-gradient(180deg, rgba(30, 28, 34, 0.95), rgba(15, 14, 18, 0.95));
            padding: 6px 14px;
            border-radius: 2px;
            font-size: 0.9em;
            border: 1px solid rgba(58, 47, 42, 0.8);
            color: rgba(216, 210, 197, 0.9);
            cursor: default;
            transition: all 0.2s;
        }

        .achievement-badge:hover {
            border-color: var(--gold-dark);
            box-shadow: 0 0 10px rgba(184, 155, 60, 0.2);
        }

        .max-points {
            text-align: center;
            padding: 20px;
            font-family: 'Cinzel', serif;
            color: var(--parchment-dark);
            font-size: 1rem;
            letter-spacing: 0.1em;
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
            font-family: 'Cinzel', serif;
            font-size: 1.2em;
            color: var(--parchment-dark);
        }

        footer {
            text-align: center;
            padding: 40px 20px 30px;
            margin-top: 40px;
            border-top: 1px solid var(--stone-light);
        }

        .footer-decoration {
            font-size: 1.5rem;
            color: var(--gold-dark);
            margin-bottom: 20px;
        }

        footer p {
            font-size: 1.1rem;
            color: var(--parchment-dark);
            margin-bottom: 8px;
        }

        footer a {
            color: var(--gold);
            text-decoration: none;
            transition: color 0.3s;
        }

        footer a:hover {
            color: var(--parchment);
        }

        @media (max-width: 600px) {
            .player-row {
                padding: 12px 15px;
            }
            .rank { width: 45px; font-size: 1em; }
            .player-name { font-size: 1em; }
            .player-points { width: 70px; font-size: 0.9em; }
            .player-details { padding: 15px; }
            .achievement-badge { font-size: 0.8em; padding: 5px 10px; }
        }
    </style>
</head>
<body>
    <div class="stone-bg"></div>
    <div class="torch-glow-left"></div>
    <div class="torch-glow-right"></div>

    <div class="page-frame">
        <a href="index.html" class="back-link">Return to the Realm</a>
        
        <header>
            <div class="banner-decoration"></div>
            <h1>&#127942; Achievement Leaderboard</h1>
            <p class="subtitle">Champions of the Void</p>
            <p id="last-update" class="last-update"></p>
        </header>

        <main>
            <div id="leaderboard" class="leaderboard">
                <div class="loading">Summoning achievement records...</div>
            </div>

            <div id="max-points" class="max-points"></div>
        </main>

        <footer>
            <div class="footer-decoration">&#8212; &#10022; &#8212;</div>
            <p><a href="index.html">Return to Void of Reality</a></p>
            <p>&#169; Void of Reality &#8212; Forged in 1995</p>
        </footer>
    </div>

    <script>
        let achievementData = null;

        async function loadAchievements() {
            try {
                const response = await fetch('achievements.json?' + Date.now());
                achievementData = await response.json();
                renderLeaderboard();
            } catch (error) {
                document.getElementById('leaderboard').innerHTML = 
                    '<div class="loading">The ancient records could not be retrieved.</div>';
            }
        }

        function renderLeaderboard() {
            const container = document.getElementById('leaderboard');
            const maxPoints = document.getElementById('max-points');
            const lastUpdate = document.getElementById('last-update');

            // Show last update time
            const updateDate = new Date(achievementData.generated * 1000);
            lastUpdate.textContent = 'Last updated: ' + updateDate.toLocaleString();

            let html = '';

            achievementData.players.forEach((player, index) => {
                const rankClass = index < 3 ? `rank-${index + 1}` : '';
                html += `
                    <div class="player-row" onclick="togglePlayer(${index})">
                        <div class="rank ${rankClass}">#${player.rank}</div>
                        <div class="player-name">${escapeHtml(player.name)}</div>
                        <div class="player-points">${player.points} pts</div>
                        <div class="arrow">&#9658;</div>
                    </div>
                    <div class="player-details" id="details-${index}">
                        ${renderPlayerDetails(player)}
                    </div>
                `;
            });

            container.innerHTML = html;
            maxPoints.textContent = `Maximum Attainable: ${achievementData.max_points} points`;
        }

        function renderPlayerDetails(player) {
            const byCategory = {};

            player.earned.forEach(achivId => {
                const achiv = achievementData.achievements.find(a => a.id === achivId);
                if (achiv) {
                    if (!byCategory[achiv.cat]) byCategory[achiv.cat] = [];
                    byCategory[achiv.cat].push(achiv);
                }
            });

            let html = '';

            Object.keys(byCategory).sort((a, b) => a - b).forEach(catId => {
                const catName = achievementData.categories[catId] || 'Unknown';
                const achievements = byCategory[catId];

                html += `
                    <div class="category-section">
                        <div class="category-name">${escapeHtml(catName)} (${achievements.length})</div>
                        <div class="achievement-list">
                            ${achievements.map(a => 
                                `<span class="achievement-badge" title="${escapeHtml(a.desc)}">${escapeHtml(a.name)}</span>`
                            ).join('')}
                        </div>
                    </div>
                `;
            });

            return html || '<p style="color: var(--parchment-dark); font-style: italic;">No achievements recorded yet.</p>';
        }

        function togglePlayer(index) {
            const row = document.querySelectorAll('.player-row')[index];
            const details = document.getElementById(`details-${index}`);
            row.classList.toggle('expanded');
            details.classList.toggle('show');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        loadAchievements();

        // Auto-refresh every 2 minutes
        setInterval(loadAchievements, 120000);
    </script>
</body>
</html>
